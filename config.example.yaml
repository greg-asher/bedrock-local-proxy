version: 1

aws:
  profile: YOUR_AWS_PROFILE
  region: us-east-2

listen: 127.0.0.1:8787

# Optional. Relative paths resolve from this configuration file.
# reporting:
#   directory: reports

# Default alias written to the generated Codex profile. The generated catalog
# includes every configured alias with complete Codex-compatible capabilities.
codex:
  default_model: luna

# Defaults used by `bedrock-proxy configure claude`. Uncomment after adding a
# Messages-compatible model alias with an exact canonical Anthropic identity.
# claude:
#   default_model: fable
#   subagent_model: fable

models:
  luna:
    display_name: Replace me
    bedrock_model_id: REPLACE_WITH_YOUR_BEDROCK_MODEL_ID
    input_per_million: 0
    output_per_million: 0
    # Set these to the documented rates when the model reports prompt-cache
    # reads or writes. A nonzero cache count cannot be estimated without its rate.
    # cache_read_input_per_million: REPLACE_WITH_DOCUMENTED_PRICE
    # cache_write_input_per_million: REPLACE_WITH_DOCUMENTED_PRICE
    temperature: 0.2
    max_tokens: 8192

    # Required for generated Codex or Claude Code metadata. Use an exact
    # bundled profile when one matches bedrock_model_id, or supply every
    # explicit value from authoritative documentation. The placeholders below
    # are not defaults.
    # capabilities:
    #   metadata_profile: REPLACE_WITH_EXACT_SUPPORTED_PROFILE
    #   responses_api: true # required for an unrecognized Codex target; verify against AWS docs
    #   messages_api: true # required for an unrecognized Claude target; verify against AWS docs
    #   anthropic_model_id: REPLACE_WITH_CANONICAL_CLAUDE_MODEL_ID
    #   context_window: REPLACE_WITH_DOCUMENTED_INTEGER
    #   max_output_tokens: REPLACE_WITH_DOCUMENTED_INTEGER
    #   input_modalities: [text]
    #   reasoning:
    #     supported: false
    #     efforts: []
    #   tools:
    #     function_calling: true
    #     parallel_calls: false

# Optional named presets. A preset narrows the shared catalog above and gives
# one setup its own port and session tag; models, pricing, and capabilities
# stay written once. Every preset needs a port no other preset and not the
# top-level `listen` uses, so several can run at the same time.
#
# Create one with: bedrock-proxy preset create
# Then run it with: bedrock-proxy --preset cheap
#
# presets:
#   cheap:
#     listen: 127.0.0.1:8788
#     session_tag: cheap
#     models: [luna]        # omit to allow every model
