version: 1

aws:
  profile: YOUR_AWS_PROFILE
  region: us-east-2

listen: 127.0.0.1:8787

# Optional. Relative paths resolve from this configuration file.
# reporting:
#   directory: reports

models:
  coding:
    display_name: Replace me
    bedrock_model_id: REPLACE_WITH_YOUR_BEDROCK_MODEL_ID
    input_per_million: 0
    output_per_million: 0
    temperature: 0.2
    max_tokens: 8192

    # Required only for Codex catalog generation. Use an exact bundled profile
